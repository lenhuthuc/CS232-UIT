<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nhận dạng công thức toán viết tay thành LaTeX" />
    <title>MathOCR</title>
  </head>
  <body>
    <main>
      <section class="card">
        <label class="drop-zone" for="image-input">
          <strong>Thả ảnh</strong>
          <input id="image-input" type="file" accept="image/png,image/jpeg,image/bmp,image/webp" />
        </label>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section id="result" class="card" hidden>
        <div class="result-heading">
          <h2>Kết quả</h2>
          <span id="latency"></span>
        </div>
        <div id="formula" class="formula"></div>
        <label for="latex">Mã LaTeX</label>
        <div class="latex-row">
          <textarea id="latex" rows="3" spellcheck="false"></textarea>
          <button id="copy" class="secondary">Sao chép</button>
        </div>
        <details>
          <summary>Thông tin debug</summary>
          <img id="processed" alt="Canvas đã crop, resize, pad và grayscale mà UniMERNet nhận" />
          <p id="shape"></p>
          <code id="tokens"></code>
        </details>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
